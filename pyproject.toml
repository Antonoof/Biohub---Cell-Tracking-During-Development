[project]
name = "biohub"
version = "0.1.0"
description = "Reproducible Biohub cell-tracking: train and infer from YAML configs."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4,<3.0.0",
    "polars>=1.20.0,<2.0.0",
    "pyarrow>=16.0.0,<22.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
score = [
    "blosc2",
    "geff>=1.1.3",
    "rustworkx>=0.17.1",
    "scipy>=1.13.0,<2.0.0",
    "threadpoolctl",
    "tracksdata",
    "zarr>=3.0.10,<4",
]
infer = [
    "biohub[score]",
    "joblib",
    "pandas>=2.2.0,<3.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "tensorboard",
    "torch==2.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.13.0,<0.14.0",
    "ty>=0.0.40",
]
score = [
    "blosc2",
    "geff>=1.1.3",
    "rustworkx>=0.17.1",
    "scipy>=1.13.0,<2.0.0",
    "threadpoolctl",
    "tracksdata",
    "zarr>=3.0.10,<4",
]
infer = [
    "joblib",
    "pandas>=2.2.0,<3.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "tensorboard",
    "torch==2.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = ["-v", "--tb=short"]
markers = ["slow: helper vs package smoke at atol 1e-6"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    "biohub_production_957_reproducibility_bundle",
    "kaggle",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.format]
quote-style = "single"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = [
    "notebooks",
    "biohub_production_957_reproducibility_bundle",
    "kaggle",
]

[[tool.uv.index]]
name = "tochka"
url = "http://package-cache-pypi.query.consul-tech/repository/pypi-public/simple"
default = true
